<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parashot MeBologna</title>
<meta name="theme-color" content="#1B2A4A">
<meta name="description" content="I commenti settimanali alla parashà della Comunità Ebraica di Bologna, di ogni anno.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone/icon-192.png">
<link rel="apple-touch-icon" href="icone/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parashot MeBologna">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A;
    --ink-soft:#2c3d63;
    --parchment:#EDE4D3;
    --bronze:#A9772F;
    --bronze-light:#C89A52;
    --wine:#7A2E2E;
    --charcoal:#2A2420;
    --line:#c9bb9c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--parchment);
    color:var(--charcoal);
    font-family:'Source Serif 4', serif;
    display:flex;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(169,119,47,0.06), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(122,46,46,0.05), transparent 45%);
  }
  ::selection{background:var(--bronze-light); color:#fff;}
  button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; text-align:left;}

  /* ---------- Barra laterale ---------- */
  #sidebar{
    width:290px; min-width:290px;
    background:var(--ink); color:var(--parchment);
    height:100vh; position:sticky; top:0; overflow-y:auto;
    padding:26px 0 40px;
  }
  #sidebar::-webkit-scrollbar{width:8px;}
  #sidebar::-webkit-scrollbar-thumb{background:var(--ink-soft); border-radius:4px;}
  .brand{padding:0 22px 18px;}
  .brand-riga{display:flex; align-items:center; gap:12px;}
  .brand-logo{width:46px; height:46px; border-radius:11px; flex-shrink:0;}
  .brand-title{font-family:'Frank Ruhl Libre', serif; font-weight:900; font-size:23px; line-height:1.2;}
  .brand-sub{font-family:'Inter', sans-serif; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--bronze-light); margin-top:6px; line-height:1.5;}
  .tabs{display:flex; margin:0 22px 8px; border:1px solid rgba(237,228,211,0.25); border-radius:3px; overflow:hidden;}
  .tab{
    flex:1; text-align:center; padding:9px 6px;
    font-family:'Inter', sans-serif; font-size:12.5px; color:rgba(237,228,211,0.7);
    transition:background .15s, color .15s;
  }
  .tab:hover{color:#fff;}
  .tab.attivo{background:var(--bronze); color:#fff; font-weight:600;}
  .etichetta-libro{
    font-family:'Inter', sans-serif; font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase;
    color:rgba(237,228,211,0.45); padding:16px 22px 6px;
  }
  .voce{
    display:flex; align-items:center; gap:10px; width:100%;
    padding:8px 22px; font-size:15px; font-family:'Frank Ruhl Libre', serif;
    color:rgba(237,228,211,0.85);
    border-left:3px solid transparent; transition:background .15s, color .15s;
  }
  .voce:hover{background:rgba(237,228,211,0.06); color:#fff;}
  .voce.attiva{background:rgba(169,119,47,0.18); border-left-color:var(--bronze-light); color:#fff;}
  .pallino{width:7px; height:7px; border-radius:50%; background:var(--bronze-light); box-shadow:0 0 0 3px rgba(200,154,82,0.25); flex-shrink:0;}
  .pallino-vuoto{width:7px; flex-shrink:0;}
  .conteggio{margin-left:auto; font-family:'Inter', sans-serif; font-size:10.5px; color:rgba(237,228,211,0.4);}
  .voce-anno{font-size:17px;}
  .voce-anno small{font-family:'Inter', sans-serif; font-size:11px; color:rgba(237,228,211,0.5);}

  /* ---------- Contenuto ---------- */
  #main{flex:1; padding:48px 56px 80px; max-width:940px; min-width:0;}
  .eyebrow{font-family:'Inter', sans-serif; font-size:11.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--bronze); margin-bottom:10px;}
  h1.titolo{font-family:'Frank Ruhl Libre', serif; font-weight:900; font-size:52px; line-height:1.05; margin:0 0 10px; color:var(--ink);}
  .badge{
    font-family:'Inter', sans-serif; font-size:11.5px; font-weight:500; letter-spacing:0.04em;
    background:var(--wine); color:#fff; padding:5px 12px; border-radius:20px;
    margin-left:14px; vertical-align:middle; white-space:nowrap;
  }
  .meta{font-family:'Inter', sans-serif; font-size:13px; color:#6b5f4f; margin-bottom:34px;}

  .scheda{
    background:#fff; border:1px solid var(--line); border-left:5px solid var(--bronze);
    padding:26px 32px; box-shadow:0 2px 14px rgba(42,36,32,0.06); margin-bottom:46px;
  }
  .scheda-tag{font-family:'Inter', sans-serif; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--bronze); font-weight:600; margin-bottom:10px;}
  .scheda-titolo{font-family:'Frank Ruhl Libre', serif; font-size:24px; color:var(--ink); margin-bottom:4px;}
  .scheda-riga{font-family:'Inter', sans-serif; font-size:13px; color:#6b5f4f; margin-bottom:18px;}
  .bottone{
    display:inline-block; font-family:'Inter', sans-serif; font-size:13px; text-decoration:none;
    color:#fff; background:var(--bronze); padding:9px 18px; border-radius:2px;
  }
  .bottone:hover{background:#8f6427;}
  .vuoto{font-family:'Inter', sans-serif; color:#8a7c66; font-size:14px; line-height:1.6;}

  .sezione{
    font-family:'Frank Ruhl Libre', serif; font-size:15px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--ink-soft); display:flex; align-items:center; gap:14px; margin-bottom:26px;
  }
  .sezione::after{content:''; flex:1; height:1px; background:var(--line);}

  /* linea del tempo (vista per parashà) */
  .timeline{position:relative; padding-left:26px;}
  .timeline::before{content:''; position:absolute; left:7px; top:6px; bottom:6px; width:2px; background:linear-gradient(var(--bronze-light), var(--line));}
  .tl-voce{position:relative; margin-bottom:18px;}
  .tl-punto{position:absolute; left:-26px; top:8px; width:14px; height:14px; border-radius:50%; background:var(--parchment); border:2px solid var(--bronze);}
  .tl-scheda{background:rgba(255,255,255,0.6); border:1px solid var(--line); padding:14px 20px;}
  .tl-anno{font-family:'Frank Ruhl Libre', serif; font-size:19px; color:var(--ink);}
  .tl-anno small{font-family:'Inter', sans-serif; font-size:11.5px; color:#8a7c66; margin-left:6px;}
  .tl-riga{font-family:'Inter', sans-serif; font-size:12.5px; color:#6b5f4f; margin-top:3px;}
  .link{font-family:'Inter', sans-serif; font-size:12.5px; color:var(--bronze); text-decoration:none; margin-top:8px; display:inline-block;}
  .link:hover{text-decoration:underline;}

  /* elenco per anno */
  .riga-anno{
    display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
    background:rgba(255,255,255,0.6); border:1px solid var(--line); border-left:4px solid var(--line);
    padding:14px 20px; margin-bottom:10px;
  }
  .riga-anno.corrente{border-left-color:var(--bronze); background:#fff;}
  .riga-nome{font-family:'Frank Ruhl Libre', serif; font-size:19px; color:var(--ink); min-width:170px;}
  .riga-nome:hover{color:var(--bronze); text-decoration:underline;}
  .riga-dettagli{font-family:'Inter', sans-serif; font-size:12.5px; color:#6b5f4f; flex:1; min-width:180px;}
  .riga-anno .link{margin-top:0;}


  /* ---------- Ricerca ---------- */
  #cerca{display:flex; gap:6px; margin:0 22px 14px;}
  #q{
    flex:1; min-width:0; font:14px 'Inter', sans-serif; padding:8px 10px; border-radius:3px;
    border:1px solid rgba(237,228,211,0.3); background:rgba(237,228,211,0.08); color:var(--parchment);
  }
  #q::placeholder{color:rgba(237,228,211,0.5);}
  #q:focus{outline:2px solid var(--bronze-light); outline-offset:1px;}
  #vai{font:600 12.5px 'Inter', sans-serif; background:var(--bronze); color:#fff; padding:0 12px; border-radius:3px; text-align:center;}
  #vai:hover{background:#8f6427;}
  mark{background:#f3d98b; color:inherit; padding:0 1px; border-radius:2px;}
  .risultato{display:block; text-decoration:none; color:inherit; background:rgba(255,255,255,0.6); border:1px solid var(--line); border-left:4px solid var(--line); padding:14px 20px; margin-bottom:10px;}
  .risultato:hover{background:#fff; border-left-color:var(--bronze);}
  .risultato-t{font-family:'Frank Ruhl Libre', serif; font-size:19px; color:var(--ink);}
  .risultato-d{font-family:'Inter', sans-serif; font-size:12.5px; color:#6b5f4f; margin-top:2px;}
  .risultato-s{font-size:15px; line-height:1.55; margin-top:8px;}
  .risultato-n{font-family:'Inter', sans-serif; font-size:11.5px; color:#8a7c66; margin-top:6px;}

  /* ---------- Lettura ---------- */
  .strumenti{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 30px; font-family:'Inter', sans-serif; font-size:12.5px;}
  .strumento{
    background:rgba(255,255,255,0.7); border:1px solid var(--line); padding:7px 12px; border-radius:2px;
    color:var(--ink); text-decoration:none; text-align:center;
  }
  .strumento:hover{background:#fff; border-color:var(--bronze);}
  .strumento[aria-disabled="true"]{opacity:.4; pointer-events:none;}
  .testo{
    --fs:19px; font-size:var(--fs); line-height:1.7; background:#fff; border:1px solid var(--line);
    padding:34px 40px; box-shadow:0 2px 14px rgba(42,36,32,0.06); max-width:720px; overflow-wrap:break-word;
  }
  .testo p{margin:0 0 1.1em;}
  .testo blockquote{margin:0 0 1.1em; padding-left:18px; border-left:3px solid var(--bronze-light); color:#4a3f35;}
  .testo h4{font-family:'Frank Ruhl Libre', serif; font-size:1.1em; color:var(--ink); margin:1.4em 0 .5em;}
  .testo a{color:var(--bronze);}
  .testo [dir="auto"]{unicode-bidi:plaintext;}
  .assente{font-family:'Inter', sans-serif; font-size:14px; line-height:1.7; background:#fff; border:1px solid var(--line); border-left:5px solid var(--bronze); padding:22px 26px; max-width:560px;}
  .fine-lettura{display:flex; justify-content:space-between; gap:10px; margin-top:26px; max-width:720px;}


  /* ---------- Approfondimenti ---------- */
  .approf{margin-top:46px; max-width:720px;}
  .approf-voce{display:block; text-decoration:none; color:inherit; background:rgba(255,255,255,0.6); border:1px solid var(--line); border-left:4px solid var(--bronze-light); padding:14px 20px; margin-bottom:10px;}
  .approf-voce:hover{background:#fff; border-left-color:var(--bronze);}
  .approf-t{font-family:'Frank Ruhl Libre', serif; font-size:18px; color:var(--ink);}
  .approf-t span{display:block; font-family:'Inter', sans-serif; font-size:12px; color:var(--bronze); margin-top:2px;}
  .approf-d{font-family:'Inter', sans-serif; font-size:12.5px; color:#6b5f4f; margin-top:3px; line-height:1.5;}

  .nota{font-family:'Inter', sans-serif; font-size:11.5px; color:#a1937c; margin-top:50px; border-top:1px solid var(--line); padding-top:16px; line-height:1.6;}
  .errore{font-family:'Inter', sans-serif; font-size:14px; line-height:1.7; background:#fff; border:1px solid var(--line); border-left:5px solid var(--wine); padding:24px 28px; max-width:560px;}

  /* barra in alto e menu a comparsa: solo su telefono */
  #topbar, #velo, #chiudi-menu{display:none;}

  @media (max-width:820px){
    body{flex-direction:column;}
    #topbar{
      display:flex; align-items:center; gap:6px; position:sticky; top:0; z-index:20;
      background:var(--ink); color:var(--parchment); padding:8px 8px; box-shadow:0 2px 10px rgba(0,0,0,.25);
    }
    .tb-btn{
      width:44px; height:44px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
      border-radius:8px; color:var(--parchment); font-size:22px; line-height:1; text-align:center;
    }
    .tb-btn:active{background:rgba(237,228,211,.14);}
    .tb-titolo{flex:1; min-width:0; display:flex; align-items:center; gap:10px; font-family:'Frank Ruhl Libre', serif; font-weight:900; font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .tb-titolo img{width:32px; height:32px; border-radius:8px; flex-shrink:0;}
    #sidebar{
      position:fixed; top:0; left:0; z-index:40; height:100vh; height:100dvh; width:min(88vw, 340px); min-width:0;
      max-height:none; transform:translateX(-102%); transition:transform .22s ease; visibility:hidden;
      padding-top:20px; box-shadow:4px 0 24px rgba(0,0,0,.4);
    }
    body.menu-aperto #sidebar{transform:none; visibility:visible;}
    #velo{display:block; position:fixed; inset:0; z-index:30; background:rgba(10,16,32,.55); opacity:0; pointer-events:none; transition:opacity .22s;}
    body.menu-aperto #velo{opacity:1; pointer-events:auto;}
    body.menu-aperto{overflow:hidden;}
    #chiudi-menu{display:flex; position:absolute; top:10px; right:10px; width:40px; height:40px; align-items:center; justify-content:center; color:var(--parchment); font-size:20px; border-radius:8px;}
    .brand{padding-right:56px;}
    .voce{padding:12px 22px;}

    #main{padding:24px 18px 60px; width:100%;}
    h1.titolo{font-size:38px;}
    .badge{margin-top:10px; margin-left:12px; display:inline-block;}
    .meta{margin-bottom:24px;}
    .scheda{padding:22px 20px; margin-bottom:34px;}
    .scheda .bottone{display:block; text-align:center; padding:14px 18px; font-size:15px; border-radius:6px;}
    .scheda .link{display:block; text-align:center; margin-top:16px; padding:6px;}
    .tl-scheda{padding:14px 16px;}
    .riga-anno{padding:14px 16px; gap:8px 14px;}
    .riga-nome{min-width:0; flex-basis:100%;}

    /* lettura: testo in alto, strumenti in una riga che scorre */
    .strumenti{flex-wrap:nowrap; overflow-x:auto; margin:0 -18px 20px; padding:0 18px 4px; scrollbar-width:none; gap:6px;}
    .strumenti::-webkit-scrollbar{display:none;}
    .strumento{flex:none; white-space:nowrap; padding:10px 14px; font-size:13px;}
    .testo{padding:22px 18px; margin:0 -4px;}
    .fine-lettura .strumento{flex:1; font-size:13px; padding:12px 8px;}
    .nota{margin-top:36px;}
  }
</style>
</head>
<body>

<header id="topbar">
  <button class="tb-btn" id="apri-menu" aria-label="Apri il menu delle parashot" aria-expanded="false">☰</button>
  <a class="tb-titolo" href="#/" style="color:inherit; text-decoration:none"><img src="icone/icona.svg" alt="" width="32" height="32"><span>Parashot MeBologna</span></a>
  <button class="tb-btn" id="apri-cerca" aria-label="Cerca nei commenti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
</header>
<div id="velo"></div>

<nav id="sidebar" aria-label="Parashot e anni">
  <button id="chiudi-menu" aria-label="Chiudi il menu">✕</button>
  <div class="brand">
    <div class="brand-riga"><img class="brand-logo" src="icone/icona.svg" alt="" width="46" height="46"><div class="brand-title">Parashot MeBologna</div></div>
    <div class="brand-sub">Commenti alla parashà<br>Comunità Ebraica di Bologna</div>
  </div>
  <form id="cerca" role="search">
    <input id="q" type="search" placeholder="Cerca nei commenti…" aria-label="Cerca nei commenti" autocomplete="off">
    <button id="vai" type="submit">Cerca</button>
  </form>
  <div class="tabs">
    <button class="tab attivo" id="tab-parasha">Per parashà</button>
    <button class="tab" id="tab-anno">Per anno</button>
  </div>
  <div id="elenco"></div>
</nav>

<main id="main"><div class="vuoto">Caricamento…</div></main>

<script>
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

const $ = id => document.getElementById(id);

// Crea elementi DOM senza mai inserire testo come HTML.
function el(tag, props = {}, ...figli){
  const e = document.createElement(tag);
  for(const [k, v] of Object.entries(props)){
    if(k === "class") e.className = v;
    else if(k.startsWith("on")) e[k] = v;
    else e.setAttribute(k, v);
  }
  for(const f of figli.flat()){
    if(f === null || f === undefined || f === false) continue;
    e.append(f.nodeType ? f : document.createTextNode(String(f)));
  }
  return e;
}

function dataIt(iso){
  if(!iso) return "data non indicata";
  const [a, m, g] = iso.split("-").map(Number);
  return `${g} ${MESI[m - 1]} ${a}`;
}
// L'anno ebraico A va da settembre/ottobre dell'anno civile A-3761 a quello dell'anno civile A-3760.
function periodo(a){ return `${a - 3761}–${String(a - 3760).slice(2)}`; }
function periodoLungo(a){ return `${a - 3761}–${a - 3760}`; }
function etichettaAnno(a){ return a ? `Anno ebraico ${a}` : "Senza data"; }

let DATI, info = {}, ordine = {}, perParasha = {}, perAnno = {}, porId = {}, anni = [];
let vista = "parasha", selP = null, selA = null;

function prepara(d){
  DATI = d;
  let n = 0;
  d.libri.forEach(l => l.parashot.forEach(p => {
    info[p.slug] = {nome: p.nome, libro: l.nome};
    ordine[p.slug] = n++;
  }));
  d.commenti.forEach(c => {
    if(!info[c.parasha]) return;
    porId[c.id] = c;
    (perParasha[c.parasha] ||= []).push(c);
    (perAnno[c.anno_ebraico || 0] ||= []).push(c);
  });
  const piuRecente = (x, y) => (y.data || "").localeCompare(x.data || "") || y.id - x.id;
  Object.values(perParasha).forEach(l => l.sort(piuRecente));
  Object.values(perAnno).forEach(l => l.sort((x, y) =>
    (ordine[x.parasha] ?? 9999) - (ordine[y.parasha] ?? 9999) || (x.data || "").localeCompare(y.data || "")));
  anni = Object.keys(perAnno).map(Number).sort((a, b) => b - a);

  selP = info[d.corrente] ? d.corrente : Object.keys(info)[0];
  const ultimo = (perParasha[selP] || [])[0];
  selA = (ultimo && ultimo.anno_ebraico) || anni[0];
}

/* ---------- barra laterale ---------- */
function disegnaElenco(){
  $("tab-parasha").classList.toggle("attivo", vista === "parasha");
  $("tab-anno").classList.toggle("attivo", vista === "anno");
  const box = $("elenco");
  box.replaceChildren();

  if(vista === "parasha"){
    DATI.libri.forEach(l => {
      box.append(el("div", {class: "etichetta-libro"}, l.nome));
      l.parashot.forEach(p => {
        const n = (perParasha[p.slug] || []).length;
        box.append(el("button",
          {class: "voce" + (p.slug === selP ? " attiva" : ""), onclick: () => vaiParasha(p.slug)},
          el("span", {class: p.slug === DATI.corrente ? "pallino" : "pallino-vuoto"}),
          el("span", {}, p.nome),
          n ? el("span", {class: "conteggio"}, n) : null));
      });
    });
  } else {
    anni.forEach(a => {
      box.append(el("button",
        {class: "voce voce-anno" + (a === selA ? " attiva" : ""), onclick: () => vaiAnno(a)},
        el("span", {}, a ? a : "Senza data", " ", a ? el("small", {}, periodo(a)) : null),
        el("span", {class: "conteggio"}, perAnno[a].length)));
    });
  }
}

/* ---------- parti comuni ---------- */
const riga = c => [dataIt(c.data), c.autore].filter(Boolean).join(" · ");
const hrefC = (c, q) => `#/c/${c.id}` + (q ? `?q=${encodeURIComponent(q)}` : "");
function azioni(c, classeLettura){
  return [c.testo
    ? el("a", {class: classeLettura, href: hrefC(c)}, "Leggi il commento →")
    : el("span", {class: "vuoto"}, "Testo non ancora disponibile")];
}

/* ---------- approfondimenti ---------- */
// Passi della Torah letti in ogni parashà (numerazione ebraica, come su Sefaria).
const PASSI = {
  "bereshit":"Genesis.1.1-6.8","noach":"Genesis.6.9-11.32","lekh-lekha":"Genesis.12.1-17.27","va-jera":"Genesis.18.1-22.24",
  "chaje-sara":"Genesis.23.1-25.18","toledot":"Genesis.25.19-28.9","va-jezze":"Genesis.28.10-32.3","vaishlach":"Genesis.32.4-36.43",
  "vayeshev":"Genesis.37.1-40.23","mikketz":"Genesis.41.1-44.17","vaiggash":"Genesis.44.18-47.27","vaishi":"Genesis.47.28-50.26",
  "shemot":"Exodus.1.1-6.1","vaera":"Exodus.6.2-9.35","bo":"Exodus.10.1-13.16","beshallach":"Exodus.13.17-17.16","itro":"Exodus.18.1-20.23",

/* ---------- testo: pulizia lato app (secondo filtro, oltre a quello dello script) ---------- */
const TAG_OK = new Set(["P","BR","STRONG","EM","U","BLOCKQUOTE","UL","OL","LI","H4","SUP","SUB","A"]);
function pulisciHtml(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const out = document.createDocumentFragment();
  (function copia(da, a){
    for(const n of da.childNodes){
      if(n.nodeType === 3){ a.append(document.createTextNode(n.nodeValue)); continue; }
      if(n.nodeType !== 1) continue;
      if(["SCRIPT","STYLE","NOSCRIPT","IFRAME","OBJECT","EMBED","TEMPLATE"].includes(n.tagName)) continue;
      if(!TAG_OK.has(n.tagName)){ copia(n, a); continue; }
      const nuovo = document.createElement(n.tagName.toLowerCase());
      if(["P","H4","LI"].includes(n.tagName)) nuovo.setAttribute("dir", "auto");
      if(n.tagName === "A"){ copia(n, a); continue; }  // nessun collegamento esterno: resta solo il testo
      copia(n, nuovo);
      a.append(nuovo);
    }
  })(doc.body, out);
  return out;
}

/* ---------- ricerca ---------- */
const VARIANTI = {a:"aàáâäã", e:"eèéêë", i:"iìíîï", o:"oòóôö", u:"uùúûü", c:"cç", n:"nñ"};
const NIQQUD = /[֑-ׇ]/g;
function sorgenteTermine(t){
  t = t.replace(NIQQUD, "").trim();
  let out = "";
  for(const ch of t){
    if(/\s/.test(ch)){ if(!out.endsWith("\\s+")) out += "\\s+"; continue; }
    const base = ch.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    if(VARIANTI[base]) out += "[" + VARIANTI[base] + "]";
    else if(/[א-ת]/.test(ch)) out += ch + "[\\u0591-\\u05C7]*";
    else out += ch.replace(/[.*+?^${}()|[\]\\\/-]/g, "\\$&");
  }
  return out;
}
function terminiDa(q){
  const t = [];
  for(const m of q.matchAll(/"([^"]+)"|(\S+)/g)){
    const v = (m[1] || m[2] || "").trim();
    if(v.length >= 2 || /[א-ת]/.test(v)) t.push(sorgenteTermine(v));
  }
  return t;
}
function reEvidenzia(q){
  const t = terminiDa(q);
  return t.length ? new RegExp(t.join("|"), "gi") : null;
}
function evidenzia(radice, re){
  const w = document.createTreeWalker(radice, NodeFilter.SHOW_TEXT);
  const nodi = [];
  while(w.nextNode()) nodi.push(w.currentNode);
  let primo = null;
  nodi.forEach(n => {
    const t = n.nodeValue; re.lastIndex = 0;
    let m, ultimo = 0, frag = null;
    while((m = re.exec(t))){
      if(m[0] === ""){ re.lastIndex++; continue; }
      frag ||= document.createDocumentFragment();
      frag.append(t.slice(ultimo, m.index));
      const mk = el("mark", {}, m[0]);
      frag.append(mk);
      primo ||= mk;
      ultimo = m.index + m[0].length;
    }
    if(frag){ frag.append(t.slice(ultimo)); n.replaceWith(frag); }
  });
  return primo;
}

let CORPUS = null;   // [{c: commento, t: testo semplice}]
function caricaCorpus(){
  if(CORPUS) return Promise.resolve(CORPUS);
  return fetch("data/ricerca.json").then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(righe => (CORPUS = righe.map(([id, t]) => ({c: porId[id], t})).filter(x => x.c)));
}

function disegnaRicerca(q){
  const main = $("main");
  main.replaceChildren(el("div", {class: "eyebrow"}, "Ricerca"), el("h1", {class: "titolo"}, `“${q}”`),
    el("div", {class: "vuoto"}, "Ricerca in corso…"));
  const termini = terminiDa(q);
  if(!termini.length){
    main.replaceChildren(el("div", {class: "eyebrow"}, "Ricerca"), el("h1", {class: "titolo"}, "Cerca nei commenti"),
      el("div", {class: "vuoto"}, "Scrivi una o più parole (servono tutte). Usa le virgolette per cercare una frase esatta, ad esempio “terra promessa”. Le maiuscole e gli accenti non contano."));
    return;
  }
  caricaCorpus().then(corpus => {
    if(location.hash !== "#/cerca/" + encodeURIComponent(q)) return;  // nel frattempo si è cambiata pagina
    const ognuno = termini.map(s => new RegExp(s, "i"));
    const conta = termini.map(s => new RegExp(s, "gi"));
    const trovati = [];
    for(const x of corpus){
      if(!ognuno.every(r => r.test(x.t))) continue;
      const n = conta.reduce((tot, r) => tot + (x.t.match(r) || []).length, 0);
      trovati.push({x, n});
    }
    trovati.sort((a, b) => b.n - a.n || (b.x.c.data || "").localeCompare(a.x.c.data || ""));
    const re = new RegExp(termini.join("|"), "gi");
    const blocchi = [
      el("div", {class: "eyebrow"}, "Ricerca"),
      el("h1", {class: "titolo"}, `“${q}”`),
      el("div", {class: "meta"}, trovati.length
        ? `${trovati.length} ${trovati.length === 1 ? "commento" : "commenti"}` + (trovati.length > 100 ? " (mostrati i primi 100)" : "")
        : "Nessun commento contiene tutti questi termini."),
    ];
    trovati.slice(0, 100).forEach(({x, n}) => {
      const c = x.c;
      re.lastIndex = 0;
      const m = re.exec(x.t);
      const da = Math.max(0, (m ? m.index : 0) - 80);
      const a = Math.min(x.t.length, (m ? m.index + m[0].length : 0) + 140);
      const sn = el("div", {class: "risultato-s"});
      sn.append((da > 0 ? "… " : "") + x.t.slice(da, a).replace(/\s+/g, " ") + (a < x.t.length ? " …" : ""));
      evidenzia(sn, new RegExp(termini.join("|"), "gi"));
      blocchi.push(el("a", {class: "risultato", href: hrefC(c, q)},
        el("div", {class: "risultato-t"}, info[c.parasha].nome, " ",
          c.anno_ebraico ? el("small", {style: "font:12px Inter,sans-serif;color:#8a7c66"}, `anno ${c.anno_ebraico}`) : null),
        el("div", {class: "risultato-d"}, riga(c)),
        sn,
        el("div", {class: "risultato-n"}, `${n} ${n === 1 ? "occorrenza" : "occorrenze"}`)));
    });
    blocchi.push(nota());
    main.replaceChildren(...blocchi);
  }).catch(() => {
    main.replaceChildren(el("div", {class: "errore"}, el("strong", {}, "La ricerca non è disponibile."), el("br"),
      "Il file dei testi non è ancora stato generato: avvia un aggiornamento dalla scheda Actions di GitHub."));
  });
}

/* ---------- lettura ---------- */
const DIMENSIONI = [16, 18, 19, 21, 24, 28];
function dimensione(){
  let i = 2;
  try{ const v = parseInt(localStorage.getItem("pmb-dim"), 10); if(v >= 0 && v < DIMENSIONI.length) i = v; }catch(e){}
  return i;
}
function salvaDimensione(i){ try{ localStorage.setItem("pmb-dim", String(i)); }catch(e){} }

function copiaLink(btn, c){
  const url = location.origin + location.pathname + `#/c/${c.id}`;
  const fatto = () => { btn.textContent = "Link copiato ✓"; setTimeout(() => btn.textContent = "Copia il link", 2000); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(fatto, () => prompt("Copia questo indirizzo:", url));
  } else prompt("Copia questo indirizzo:", url);
}

function disegnaLettura(c, q){
  const p = info[c.parasha];
  const lista = perParasha[c.parasha];
  const k = lista.indexOf(c);
  const piuVecchia = lista[k + 1], piuNuova = lista[k - 1];
  const nav = (x, testo) => x
    ? el("a", {class: "strumento", href: hrefC(x, q)}, testo)
    : el("span", {class: "strumento", "aria-disabled": "true"}, testo);

  let dim = dimensione();
  const corpo = el("div", {class: "testo"}, el("div", {class: "vuoto"}, "Caricamento del testo…"));
  const applica = () => corpo.style.setProperty("--fs", DIMENSIONI[dim] + "px");
  applica();
  const piccolo = el("button", {class: "strumento", title: "Testo più piccolo", onclick: () => { dim = Math.max(0, dim - 1); salvaDimensione(dim); applica(); }}, "A−");
  const grande = el("button", {class: "strumento", title: "Testo più grande", onclick: () => { dim = Math.min(DIMENSIONI.length - 1, dim + 1); salvaDimensione(dim); applica(); }}, "A+");
  const copia = el("button", {class: "strumento"}, "Copia il link");
  copia.onclick = () => copiaLink(copia, c);

  $("main").replaceChildren(
    el("div", {class: "eyebrow"}, el("a", {href: `#/p/${c.parasha}`, style: "color:inherit"}, `${p.libro} · tutte le edizioni`)),
    el("h1", {class: "titolo"}, p.nome),
    el("div", {class: "meta"}, [riga(c), c.anno_ebraico ? `anno ebraico ${c.anno_ebraico}` : null].filter(Boolean).join(" · ")),
    el("div", {class: "strumenti"},
      nav(piuVecchia, "← " + (piuVecchia ? (piuVecchia.anno_ebraico || "precedente") : "precedente")),
      nav(piuNuova, (piuNuova ? (piuNuova.anno_ebraico || "successiva") : "successiva") + " →"),
      piccolo, grande, copia),
    corpo,
    el("div", {class: "fine-lettura"}, nav(piuVecchia, "← Edizione precedente"), nav(piuNuova, "Edizione successiva →")),
    approfondimenti(c.parasha),
    nota());

  fetch(`data/testi/${c.id}.json`).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(t => {
      if(location.hash.split("?")[0] !== `#/c/${c.id}`) return;
      corpo.replaceChildren(pulisciHtml(t.html || ""));
      const re = q ? reEvidenzia(q) : null;
      const primo = re ? evidenzia(corpo, re) : null;
      if(primo) primo.scrollIntoView({block: "center"});
    })
    .catch(() => corpo.replaceChildren(el("div", {class: "assente"},
      "Il testo di questo commento non è disponibile in questo momento. Se sei senza rete, riprova quando sei online.")));
}

let statoOffline = "";
function nota(){
  const gen = DATI.generato ? new Date(DATI.generato) : null;
  const quando = gen && !isNaN(gen) ? ` Ultimo aggiornamento dell'archivio: ${gen.getDate()} ${MESI[gen.getMonth()]} ${gen.getFullYear()}.` : "";
  return el("div", {class: "nota"},
    "Commenti alla parashà della Comunità Ebraica di Bologna, di Rav Alberto Sermoneta e Rav Marco Del Monte." + quando,
    el("span", {id: "stato-offline"}, statoOffline));
}

/* ---------- navigazione (l'indirizzo della pagina dice sempre dove si è) ---------- */
function route(){
  chiudiMenu();
  const h = location.hash.replace(/^#\/?/, "");
  const [percorso, qs = ""] = h.split("?");
  const seg = percorso.split("/");
  const q = new URLSearchParams(qs).get("q") || "";
  $("q").value = seg[0] === "cerca" ? decodeURIComponent(seg.slice(1).join("/")) : "";

  if(seg[0] === "c" && porId[seg[1]]){
    const c = porId[seg[1]];
    selP = c.parasha; vista = "parasha";
    if(c.anno_ebraico) selA = c.anno_ebraico;
    disegnaElenco(); disegnaLettura(c, q);
  } else if(seg[0] === "cerca"){
    disegnaElenco(); disegnaRicerca(decodeURIComponent(seg.slice(1).join("/")));
  } else {
    if(seg[0] === "a" && perAnno[seg[1]]){ selA = Number(seg[1]); vista = "anno"; }
    else if(seg[0] === "p" && info[seg[1]]){ selP = seg[1]; vista = "parasha"; }
    disegnaElenco();
    vista === "parasha" ? disegnaParasha() : disegnaAnno();
  }
  window.scrollTo({top: 0});
}
function apriMenu(cerca){
  document.body.classList.add("menu-aperto");
  $("apri-menu").setAttribute("aria-expanded", "true");
  if(cerca) setTimeout(() => $("q").focus(), 250);
}
function chiudiMenu(){
  document.body.classList.remove("menu-aperto");
  $("apri-menu").setAttribute("aria-expanded", "false");
}
$("apri-menu").onclick = () => apriMenu(false);
$("apri-cerca").onclick = () => apriMenu(true);
$("chiudi-menu").onclick = chiudiMenu;
$("velo").onclick = chiudiMenu;
document.addEventListener("keydown", e => { if(e.key === "Escape") chiudiMenu(); });

function vaiParasha(slug){ chiudiMenu(); location.hash = `#/p/${slug}`; }
function vaiAnno(a){ chiudiMenu(); location.hash = `#/a/${a}`; }

$("tab-parasha").onclick = () => vaiParasha(selP);
$("tab-anno").onclick = () => vaiAnno(selA);
$("cerca").onsubmit = e => {
  e.preventDefault();
  const q = $("q").value.trim();
  chiudiMenu();
  if(q) location.hash = "#/cerca/" + encodeURIComponent(q);
};
/* ---------- uso senza rete ---------- */
// Dopo la prima visita l'app scarica in sottofondo tutti i testi (circa 5 MB); il service worker li salva.
function scaricaPerOffline(){
  if(!("serviceWorker" in navigator) || !DATI) return;
  const conn = navigator.connection || {};
  if(conn.saveData) return;
  const chiave = "pmb-offline";
  try{ if(localStorage.getItem(chiave) === DATI.generato) { mostraOffline("Disponibile anche senza rete."); return; } }catch(e){}
  const ids = DATI.commenti.filter(c => c.testo).map(c => c.id);
  let fatti = 0, errori = 0;
  const imposta = () => mostraOffline(fatti + errori < ids.length
    ? `Scarico i testi per l'uso senza rete… ${fatti}/${ids.length}` : (errori ? "Alcuni testi non sono stati salvati per l'uso senza rete." : "Disponibile anche senza rete."));
  const prossimo = () => {
    const id = ids.pop();
    if(id === undefined) return Promise.resolve();
    return fetch(`data/testi/${id}.json`).then(r => { r.ok ? fatti++ : errori++; }, () => errori++)
      .then(() => { if(fatti % 25 === 0) imposta(); return prossimo(); });
  };
  ids.length && navigator.serviceWorker.ready.then(() => {
    imposta();
    return Promise.all([prossimo(), prossimo(), prossimo(), prossimo()]);
  }).then(() => {
    fetch("data/ricerca.json").catch(() => {});
    mostraOffline(errori ? "Alcuni testi non sono stati salvati per l'uso senza rete." : "Disponibile anche senza rete.");
    if(!errori){ try{ localStorage.setItem(chiave, DATI.generato); }catch(e){} }
  });
}
function mostraOffline(testo){
  statoOffline = " " + testo;
  const e = document.getElementById("stato-offline");
  if(e) e.textContent = statoOffline;
}
if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

window.addEventListener("hashchange", () => { if(DATI) route(); });

fetch("data/data.json", {cache: "no-cache"})
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { prepara(d); route(); setTimeout(scaricaPerOffline, 3000); })
  .catch(() => {
    $("elenco").replaceChildren();
    $("main").replaceChildren(el("div", {class: "errore"},
      el("strong", {}, "I dati non sono ancora disponibili."),
      el("br"),
      "Se hai appena creato il sito, avvia il primo aggiornamento dalla scheda Actions di GitHub. Se invece lo stai aprendo da un file sul computer, ricorda che va visto all'indirizzo pubblicato."));
  });
