name: Aggiorna e pubblica

on:
  schedule:
    # Ogni venerdì alle 07:13 UTC (08:13 in inverno, 09:13 in estate in Italia)
    - cron: "13 7 * * 5"
  workflow_dispatch:        # pulsante "Run workflow" per aggiornare a mano
  push:
    branches: [main]        # ripubblica quando cambia l'app

permissions:
  contents: write           # per salvare data/data.json nel repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Raccogli i commenti dal sito
        run: python scripts/build_data.py data/data.json

      - name: Salva i dati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --staged --quiet || (git commit -m "Aggiorna il catalogo dei commenti" && git push)

      - name: Prepara il sito
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/data.json _site/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
